#include &lt;bits/stdc++.h&gt;
using namespace std;
int main() {
    ios_base::sync_with_stdio(false);
    cin.tie(NULL);
    int n;
    cin &gt;&gt; n;
    vector&lt;int&gt; a(n);
    for (int i = 0; i &lt; n; i++) cin &gt;&gt; a[i];
    sort(a.begin(), a.end());
    cout &lt;&lt; a[0] &lt;&lt; " " &lt;&lt; a[n-1] &lt;&lt; endl;
    return 0;
}
